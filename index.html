<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 1</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
      color: #222;
      background: #fafafa;
    }
    h1 { color: #2b5797; }
    button {
      padding: 8px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background: #2b5797;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #1e3f6e; }
  </style>
</head>
<body>
  <h1>Agentic Programming 67723 – Lab 1</h1>
  <p>Welcome! This is a simple web page.</p>

  <button id="btn">Click me</button>
  <p id="count">You clicked 0 times.</p>

  <script>
    let clicks = 0;
    document.getElementById("btn").addEventListener("click", () => {
      clicks++;
      document.getElementById("count").textContent = `You clicked ${clicks} times.`;
    });
  </script>
</body>
</html>
